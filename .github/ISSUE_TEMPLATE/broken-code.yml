name: Code qui ne marche plus
description: Signaler un code USSD ou une offre incorrecte
title: "[Code cassé] "
labels: ["broken-code"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Ne partagez **jamais** votre code secret. Floutez les numéros et soldes sur vos captures.
  - type: dropdown
    id: operator
    attributes:
      label: Opérateur
      options:
        - Yas Togo
        - Moov Africa Togo
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Lien de la fiche Telko
      placeholder: https://telko.africa/...
  - type: input
    id: code
    attributes:
      label: Code composé
      description: Sans votre code secret.
      placeholder: "*909*...#"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ce qui s'est passé
      description: Message affiché, prix différent, offre introuvable…
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date du test
      placeholder: "2026-10-18"
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Capture d'écran (facultatif)
      description: Floutez numéros, noms et soldes.
